# GitLab CI — 提交(push) + 合并(MR) 双场景代码审查
# 审查规则来自芯宏中央仓库 org scope Skill（默认 org-code-review）
# 符合 → job 成功；不符合 → job 失败 → 无法合并 / 流水线失败
#
# 业务仓库 .gitlab-ci.yml:
#   include:
#     - local: '.gitlab/skills-review.yml'
#   或从模板项目 include 本文件

stages:
  - review

variables:
  SKILLS_REVIEW_SKILL_NAME: "org-code-review"
  SKILLS_REVIEW_FAIL_ON: "blocker"
  # 业务仓库建议拷到 .gitlab/skills-review.sh 并改此变量
  SKILLS_REVIEW_SCRIPT: "examples/gitlab/skills-review.sh"

.skills_review_base:
  stage: review
  image: alpine:3.20
  allow_failure: false
  timeout: 15m
  before_script:
    - apk add --no-cache curl jq git bash
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - review-report.json

# ── 1. 合并代码（MR）────────────────────────────────────────
skills-review-merge:
  extends: .skills_review_base
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - export SKILLS_REVIEW_EVENT=merge
    - export SKILLS_REVIEW_BASE_SHA="$CI_MERGE_REQUEST_DIFF_BASE_SHA"
    - export SKILLS_REVIEW_HEAD_SHA="$CI_COMMIT_SHA"
    - export SKILLS_REVIEW_REF="$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME"
    - bash "$SKILLS_REVIEW_SCRIPT"

# ── 2. 提交代码（push 到分支）──────────────────────────────
skills-review-push:
  extends: .skills_review_base
  rules:
    # 有 open MR 时由 merge job 审查，避免重复
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_PIPELINE_SOURCE == "push"
  script:
    - export SKILLS_REVIEW_EVENT=push
    - |
      if [ -n "${CI_COMMIT_BEFORE_SHA:-}" ] && [ "$CI_COMMIT_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
        export SKILLS_REVIEW_BASE_SHA="$CI_COMMIT_BEFORE_SHA"
      else
        export SKILLS_REVIEW_BASE_SHA="${CI_COMMIT_SHA}^"
      fi
    - export SKILLS_REVIEW_HEAD_SHA="$CI_COMMIT_SHA"
    - export SKILLS_REVIEW_REF="$CI_COMMIT_REF_NAME"
    - bash "$SKILLS_REVIEW_SCRIPT"
